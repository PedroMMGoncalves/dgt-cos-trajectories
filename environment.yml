# Plain conda environment mirroring arcgispro-py3 (ArcGIS Pro, checked 2026-11-12),
# for running the CLI and tests outside ArcGIS:  conda env create -f environment.yml
name: cos-trajectories
channels:
  - conda-forge
dependencies:
  - python=3.13
  - geopandas=1.1.3
  - shapely=2.1.2
  - fiona=1.10.1
  - gdal=3.12
  - pandas=3.0.0
  - numpy=2.3.5
  - pyproj
  - pytest
